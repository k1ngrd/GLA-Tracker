#guild-app .wrap { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }

#guild-app .topbar {
  display: flex; justify-content: space-between; align-items: flex-end;
  flex-wrap: wrap; gap: 18px; margin-bottom: 22px;
  border-bottom: 1px solid rgba(216,173,77,0.25);
  padding-bottom: 18px;
}
#guild-app .brand-eyebrow {
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--gold); font-weight: 600; margin-bottom: 6px; opacity: 0.85;
}
#guild-app h1 {
  font-family: 'Metal Mania', cursive; font-weight: 400; font-size: 42px;
  margin: 0; color: var(--gold-soft); letter-spacing: 1.5px; line-height: 1;
  text-shadow: 0 0 18px rgba(216,173,77,0.45), 0 2px 4px rgba(0,0,0,0.6);
}
#guild-app .date-line { color: var(--mist); font-size: 13px; margin-top: 6px; }
#guild-app .date-line b { color: var(--gold-soft); }

#guild-app .topbar-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }

#guild-app .reset-pill {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid rgba(216,173,77,0.35);
  border-radius: 999px;
  padding: 10px 18px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}
#guild-app .reset-pill .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
  box-shadow: 0 0 10px var(--ok); flex: none;
}
#guild-app .reset-pill .txt { font-size: 12.5px; color: var(--mist); margin-right: -4px; }
#guild-app .reset-pill .clock { font-family: 'Cinzel', serif; color: var(--gold-soft); font-weight: 700; font-size: 14px; }

#guild-app .creator-btn {
  position: relative; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid rgba(216,173,77,0.35);
  color: var(--gold-soft); font-size: 11.5px; font-weight: 600;
  padding: 6px 16px; border-radius: 999px; cursor: default;
  font-family: 'Inter', sans-serif; letter-spacing: 0.3px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  transition: box-shadow 0.25s ease, border-color 0.25s ease, transform 0.15s ease;
}
#guild-app .creator-btn::after {
  content: "";
  position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
  background: linear-gradient(115deg, transparent, rgba(216,173,77,0.55), transparent);
  transform: skewX(-20deg);
  animation: creator-shine 3.2s ease-in-out infinite;
}
#guild-app .creator-btn:hover {
  border-color: var(--gold); transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(216,173,77,0.3);
}
@keyframes creator-shine {
  0% { left: -60%; }
  35% { left: 130%; }
  100% { left: 130%; }
}

#guild-app .table-scroll {
  overflow-x: auto;
  border-radius: 14px;
  border: 1px solid rgba(216,173,77,0.22);
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  background: var(--deep);
}
#guild-app table { border-collapse: collapse; width: 100%; min-width: 980px; }

#guild-app thead .grp-row th {
  font-family: 'Cinzel', serif; font-size: 12.5px; letter-spacing: 1px;
  text-transform: uppercase; font-weight: 700;
  padding: 10px 6px; text-align: center; border-left: 2px solid var(--deep);
}
#guild-app thead .col-row th {
  font-size: 11.5px; font-weight: 600; color: var(--mist);
  padding: 10px 8px; text-align: center; background: var(--panel);
  border-left: 1px solid rgba(255,255,255,0.06);
  white-space: nowrap;
}

#guild-app th.corner-top, #guild-app th.corner-bottom {
  position: sticky; left: 0; z-index: 6;
  border-right: 2px solid #1a3d58;
}
#guild-app th.corner-top { background: var(--ink); }
#guild-app th.corner-bottom { background: var(--ink); text-align: left !important; padding-left: 14px !important; color: var(--gold-soft); }

</style>

<div id="guild-app">
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand-eyebrow">Conteúdos Diários &amp; Semanais</div>
        <h1>GLA Tracker</h1>
        <div class="date-line">Hoje é <b id="today-label">—</b></div>
      </div>
      <div class="topbar-right">
        <div class="reset-pill">
          <span class="dot"></span>
          <span class="txt">Reseta em</span>
          <span class="clock" id="countdown">—</span>
        </div>
        <button class="creator-btn" type="button">Desenvolvido por Ymir Fritz</button>
      </div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr class="grp-row" id="grp-row"></tr>
          <tr class="col-row" id="col-row"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="addbar">
      <input class="name" id="new-name" placeholder="Nome do membro" />
      <input class="set" id="new-set" placeholder="Set" />
      <button class="btn-gold" id="add-btn">+ Adicionar membro</button>
      <button class="manual-reset" id="reset-btn">Resetar marcações agora</button>
    </div>

    <div class="section-title">Categorias</div>
    <div class="cat-panel">
      <div class="cat-blocks" id="cat-blocks"></div>
      <div class="cat-form">
        <input type="text" class="cat-name" id="cat-name" placeholder="Nome da categoria (ex: JAYA)" />
        <input type="color" id="cat-color" value="#4fd8f0" />
        <input type="text" class="cat-cols" id="cat-cols" placeholder="Sub-itens separados por vírgula (ex: Bosses, Elite)" />
        <button class="btn-gold" id="cat-add-btn">+ Adicionar categoria</button>
        <small>Cada categoria precisa de pelo menos um sub-item para gerar as caixinhas de marcação.</small>
      </div>
    </div>

    <div class="footnote">As marcações resetam automaticamente toda sexta-feira às 00:00 (horário de Brasília, GMT-3). Membros, sets e categorias ficam salvos.</div>
  </div>
</div>

<script>
(function () {
  const TZ = 'America/Sao_Paulo'; // GMT-3

  // Prefer Claude's cloud storage (works inside claude.ai). When the file is
  // downloaded and opened directly in a browser, window.storage doesn't
  // exist, so fall back to the browser's own localStorage to keep
  // auto-save working there too.
  function makeLocalFallback() {
    const PREFIX = 'gla-tracker::';
    return {
      async get(key) {
        const raw = localStorage.getItem(PREFIX + key);
        return raw === null ? null : { key, value: raw, shared: false };
      },
      async set(key, value) {
        localStorage.setItem(PREFIX + key, value);
        return { key, value, shared: false };
      },
      async delete(key) {
        localStorage.removeItem(PREFIX + key);
        return { key, deleted: true, shared: false };
      },
      async list(prefix) {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(PREFIX + (prefix || ''))) keys.push(k.slice(PREFIX.length));
        }
        return { keys };
      }
    };
  }
  const S = (typeof window.storage !== 'undefined' && window.storage) ? window.storage : makeLocalFallback();
  const KEY_GROUPS = 'guild-groups';
  const KEY_MEMBERS = 'guild-members';
  const KEY_PROGRESS = 'guild-progress';

  const DEFAULT_GROUPS = [
    { id: 'Bosses_Semanais', name: 'Bosses Semanais', color: '#4fd8f0', cols: [
      { key: 'Alabasta', label: 'Alabasta' },
      { key: 'Jaya', label: 'Jaya' },
      { key: 'Novos', label: 'Novos' },
    ]},
    { id: 'Boss_Rush', name: 'Boss Rush', color: '#86d69a', cols: [
      { key: 'Sabaody', label: 'Sabaody' },
    ]},
    { id: 'Raids', name: 'Raids', color: '#3ee83e', cols: [
      { key: 'Skypiea', label: 'Skypiea' },
      { key: 'Enies Lobby', label: 'Enies Lobby' },
    ]},
  ];

  const DEFAULT_MEMBERS = [
    { id: 'm1', name: 'Conta 1', set: 16 },
    { id: 'm2', name: 'Conta 2', set: 16 },
    { id: 'm3', name: 'Conta 3', set: 12 },
    { id: 'm4', name: 'Conta 4', set: 8 },
    { id: 'm5', name: 'Conta 5', set: 8 },
  ];

  let groups = [];
  let members = [];
  let progress = { period: periodStart(), data: {} };

  function allCols() { return groups.flatMap(g => g.cols.map(c => g.id + '::' + c.key)); }

  // --- weekly reset (Friday 00:00 BRT) helpers ---
  function brtDateParts(d) {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: TZ, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).formatToParts(d).reduce((a, p) => (a[p.type] = p.value, a), {});
    return parts;
  }

  function periodStart() {
    const p = brtDateParts(new Date());
    const y = +p.year, m = +p.month, day = +p.day;
    const weekday = new Date(Date.UTC(y, m - 1, day)).getUTCDay(); // 0=Sun..6=Sat, date-only math, tz-safe
    const daysSinceFriday = (weekday - 5 + 7) % 7;
    const fri = new Date(Date.UTC(y, m - 1, day - daysSinceFriday));
    return fri.toISOString().slice(0, 10);
  }

  function msUntilNextReset() {
    const p = brtDateParts(new Date());
    const y = +p.year, m = +p.month, day = +p.day;
    const weekday = new Date(Date.UTC(y, m - 1, day)).getUTCDay();
    let daysUntil = (5 - weekday + 7) % 7;
    if (daysUntil === 0) daysUntil = 7; // today is Friday, reset already happened at 00:00
    const secsPassedToday = (+p.hour) * 3600 + (+p.minute) * 60 + (+p.second);
    const totalSecs = daysUntil * 86400 - secsPassedToday;
    return totalSecs * 1000;
  }

  // --- storage ---
  async function loadGroups() {
    try {
      const r = await S.get(KEY_GROUPS, false);
      groups = r ? JSON.parse(r.value) : DEFAULT_GROUPS.slice();
      if (!r) await S.set(KEY_GROUPS, JSON.stringify(groups), false);
    } catch (e) { groups = DEFAULT_GROUPS.slice(); }
  }
  async function saveGroups() { try { await S.set(KEY_GROUPS, JSON.stringify(groups), false); } catch (e) {} }

  async function loadMembers() {
    try {
      const r = await S.get(KEY_MEMBERS, false);
      members = r ? JSON.parse(r.value) : DEFAULT_MEMBERS.slice();
      if (!r) await S.set(KEY_MEMBERS, JSON.stringify(members), false);
    } catch (e) { members = DEFAULT_MEMBERS.slice(); }
  }
  async function saveMembers() { try { await S.set(KEY_MEMBERS, JSON.stringify(members), false); } catch (e) {} }

  async function loadProgress() {
    try {
      const r = await S.get(KEY_PROGRESS, false);
      const stored = r ? JSON.parse(r.value) : null;
      if (stored && stored.period === periodStart()) {
        progress = stored;
      } else {
        progress = { period: periodStart(), data: {} };
        await S.set(KEY_PROGRESS, JSON.stringify(progress), false);
      }
    } catch (e) {
      progress = { period: periodStart(), data: {} };
    }
  }
  async function saveProgress() { try { await S.set(KEY_PROGRESS, JSON.stringify(progress), false); } catch (e) {} }

  // --- render ---
  function textColorFor(hex) {
    const c = hex.replace('#', '');
    const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? '#08131d' : '#ffffff';
  }

  function renderHead() {
    const grpRow = document.getElementById('grp-row');
    const colRow = document.getElementById('col-row');
    grpRow.innerHTML = '<th class="corner-top"></th>' +
      groups.filter(g => g.cols.length > 0).map(g => `<th colspan="${g.cols.length}" style="background:${g.color}; color:${textColorFor(g.color)}">${g.name}</th>`).join('') +
      '<th style="background:#0c1b26;"></th>';
    colRow.innerHTML = '<th class="corner-bottom">Membro</th>' +
      groups.flatMap(g => g.cols.map(c => `<th>${c.label}</th>`)).join('') +
      '<th>Progresso</th>';
  }

  function badgeColor(pct) {
    if (pct >= 100) return 'background:rgba(62,207,110,0.18); color:#3ecf6e; border:1px solid rgba(62,207,110,0.4);';
    if (pct >= 50) return 'background:rgba(216,173,77,0.18); color:#d8ad4d; border:1px solid rgba(216,173,77,0.4);';
    return 'background:rgba(255,255,255,0.06); color:#9fb8c9; border:1px solid rgba(255,255,255,0.12);';
  }

  function renderBody() {
    const cols = allCols();
    const total = cols.length;
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = members.map(m => {
      const done = cols.filter(k => progress.data[m.id] && progress.data[m.id][k]).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const cells = groups.flatMap(g => g.cols.map(c => {
        const fullKey = g.id + '::' + c.key;
        const checked = progress.data[m.id] && progress.data[m.id][fullKey];
        return `<td><input type="checkbox" class="chk" data-member="${m.id}" data-col="${fullKey}" ${checked ? 'checked' : ''}/></td>`;
      })).join('');
      return `
        <tr>
          <td class="member-cell">
            <input class="member-name" data-member="${m.id}" value="${m.name.replace(/"/g,'&quot;')}" />
            <div class="member-meta">
              <span class="set-label">SET</span>
              <input class="set-input" data-member="${m.id}" type="text" value="${m.set}" />
              <button class="del-btn" data-member="${m.id}" title="Remover membro">✕</button>
            </div>
          </td>
          ${cells}
          <td class="progress-cell"><span class="progress-badge" style="${badgeColor(pct)}">${done}/${total}</span></td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('.chk').forEach(el => el.addEventListener('change', onToggle));
    tbody.querySelectorAll('.member-name').forEach(el => el.addEventListener('change', onRename));
    tbody.querySelectorAll('.set-input').forEach(el => el.addEventListener('change', onSetChange));
    tbody.querySelectorAll('.del-btn').forEach(el => el.addEventListener('click', onDeleteMember));
  }

  function renderCatChips() {
    const el = document.getElementById('cat-blocks');
    el.innerHTML = groups.map(g => `
      <div class="cat-block">
        <span class="cat-chip" draggable="true" data-group="${g.id}">
          <span class="drag-handle">⠿</span>
          <span class="swatch" style="background:${g.color}"></span>
          <input class="cat-name-input" data-group="${g.id}" value="${g.name.replace(/"/g,'&quot;')}" />
          <button class="cat-del-btn" data-group="${g.id}" title="Remover categoria">✕</button>
        </span>
        ${g.cols.length ? `
        <div class="subitem-row" data-group="${g.id}">
          ${g.cols.map(c => `
            <span class="subitem-chip" draggable="true" data-group="${g.id}" data-col="${c.key}">
              <span class="drag-handle">⠿</span>
              <input class="subitem-name-input" data-group="${g.id}" data-col="${c.key}" value="${c.label.replace(/"/g,'&quot;')}" />
              <button class="sub-del-btn" data-group="${g.id}" data-col="${c.key}" title="Remover sub-item">✕</button>
            </span>`).join('')}
        </div>` : `<div class="subitem-empty">Sem sub-itens</div>`}
      </div>`).join('') || '<span style="color:#62798c;font-size:12px;">Nenhuma categoria ainda.</span>';

    el.querySelectorAll('.cat-del-btn').forEach(b => b.addEventListener('click', onDeleteGroup));
    el.querySelectorAll('.cat-name-input').forEach(inp => {
      inp.addEventListener('change', onRenameGroup);
      inp.addEventListener('click', e => e.stopPropagation());
    });
    el.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('dragstart', onChipDragStart);
      chip.addEventListener('dragover', onChipDragOver);
      chip.addEventListener('dragleave', onChipDragLeave);
      chip.addEventListener('drop', onChipDrop);
      chip.addEventListener('dragend', onChipDragEnd);
    });

    el.querySelectorAll('.sub-del-btn').forEach(b => b.addEventListener('click', onDeleteSubItem));
    el.querySelectorAll('.subitem-name-input').forEach(inp => {
      inp.addEventListener('change', onRenameSubItem);
      inp.addEventListener('click', e => e.stopPropagation());
    });
    el.querySelectorAll('.subitem-chip').forEach(chip => {
      chip.addEventListener('dragstart', onSubDragStart);
      chip.addEventListener('dragover', onSubDragOver);
      chip.addEventListener('dragleave', onSubDragLeave);
      chip.addEventListener('drop', onSubDrop);
      chip.addEventListener('dragend', onSubDragEnd);
    });
  }

  let draggedGroupId = null;

  function onChipDragStart(e) {
    draggedGroupId = e.currentTarget.dataset.group;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  }
  function onChipDragOver(e) {
    e.preventDefault();
    if (e.currentTarget.dataset.group !== draggedGroupId) e.currentTarget.classList.add('drag-over');
  }
  function onChipDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }
  async function onChipDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.remove('drag-over');
    const targetId = e.currentTarget.dataset.group;
    if (!draggedGroupId || draggedGroupId === targetId) return;
    const fromIdx = groups.findIndex(g => g.id === draggedGroupId);
    const toIdx = groups.findIndex(g => g.id === targetId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = groups.splice(fromIdx, 1);
    groups.splice(toIdx, 0, moved);
    await saveGroups();
    renderHead();
    renderCatChips();
    renderBody();
  }
  function onChipDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('#guild-app .cat-chip').forEach(c => c.classList.remove('drag-over'));
    draggedGroupId = null;
  }

  async function onRenameGroup(e) {
    const id = e.target.dataset.group;
    const g = groups.find(x => x.id === id);
    if (g) {
      g.name = e.target.value.trim() || g.name;
      await saveGroups();
      renderHead();
    }
  }

  // --- sub-item (column) drag / rename / delete ---
  let draggedSub = null; // { groupId, key }

  function onSubDragStart(e) {
    draggedSub = { groupId: e.currentTarget.dataset.group, key: e.currentTarget.dataset.col };
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.stopPropagation();
  }
  function onSubDragOver(e) {
    e.preventDefault();
    e.stopPropagation();
    if (!draggedSub) return;
    const g = e.currentTarget.dataset.group, k = e.currentTarget.dataset.col;
    if (draggedSub.groupId === g && draggedSub.key !== k) e.currentTarget.classList.add('drag-over');
  }
  function onSubDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
  }
  async function onSubDrop(e) {
    e.preventDefault();
    e.stopPropagation();
    e.currentTarget.classList.remove('drag-over');
    if (!draggedSub) return;
    const targetGroupId = e.currentTarget.dataset.group;
    const targetKey = e.currentTarget.dataset.col;
    if (draggedSub.groupId !== targetGroupId) return; // only reorder within the same category
    if (draggedSub.key === targetKey) return;
    const g = groups.find(x => x.id === targetGroupId);
    if (!g) return;
    const fromIdx = g.cols.findIndex(c => c.key === draggedSub.key);
    const toIdx = g.cols.findIndex(c => c.key === targetKey);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = g.cols.splice(fromIdx, 1);
    g.cols.splice(toIdx, 0, moved);
    await saveGroups();
    renderHead();
    renderCatChips();
    renderBody();
  }
  function onSubDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('#guild-app .subitem-chip').forEach(c => c.classList.remove('drag-over'));
    draggedSub = null;
  }

  async function onRenameSubItem(e) {
    const groupId = e.target.dataset.group, key = e.target.dataset.col;
    const g = groups.find(x => x.id === groupId);
    const c = g && g.cols.find(x => x.key === key);
    if (c) {
      c.label = e.target.value.trim() || c.label;
      await saveGroups();
      renderHead();
    }
  }

  async function onDeleteSubItem(e) {
    const groupId = e.target.dataset.group, key = e.target.dataset.col;
    const g = groups.find(x => x.id === groupId);
    if (!g) return;
    g.cols = g.cols.filter(c => c.key !== key);
    await saveGroups();
    renderHead();
    renderCatChips();
    renderBody();
  }

  // --- events ---
  async function onToggle(e) {
    const id = e.target.dataset.member, col = e.target.dataset.col;
    if (!progress.data[id]) progress.data[id] = {};
    progress.data[id][col] = e.target.checked;
    await saveProgress();
    renderBody();
  }

  async function onRename(e) {
    const id = e.target.dataset.member;
    const m = members.find(x => x.id === id);
    if (m) { m.name = e.target.value.trim() || m.name; await saveMembers(); }
  }

  async function onSetChange(e) {
    const id = e.target.dataset.member;
    const m = members.find(x => x.id === id);
    if (m) { m.set = e.target.value.trim(); await saveMembers(); }
  }

  async function onDeleteMember(e) {
    const id = e.target.dataset.member;
    members = members.filter(x => x.id !== id);
    delete progress.data[id];
    await saveMembers();
    await saveProgress();
    renderBody();
  }

  async function onDeleteGroup(e) {
    const id = e.target.dataset.group;
    groups = groups.filter(g => g.id !== id);
    await saveGroups();
    renderHead();
    renderCatChips();
    renderBody();
  }

  document.getElementById('add-btn').addEventListener('click', async () => {
    const nameEl = document.getElementById('new-name');
    const setEl = document.getElementById('new-set');
    const name = nameEl.value.trim();
    if (!name) return;
    const id = 'm' + Date.now();
    members.push({ id, name, set: setEl.value.trim() || '-' });
    nameEl.value = ''; setEl.value = '';
    await saveMembers();
    renderBody();
  });

  document.getElementById('cat-add-btn').addEventListener('click', async () => {
    const nameEl = document.getElementById('cat-name');
    const colorEl = document.getElementById('cat-color');
    const colsEl = document.getElementById('cat-cols');
    const name = nameEl.value.trim();
    const colsRaw = colsEl.value.trim();
    if (!name || !colsRaw) return;
    const id = name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || ('cat' + Date.now());
    const cols = colsRaw.split(',').map(s => s.trim()).filter(Boolean).map(label => ({
      key: label.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '_'),
      label
    }));
    if (!cols.length) return;
    groups.push({ id: groups.some(g => g.id === id) ? id + '_' + Date.now() : id, name, color: colorEl.value, cols });
    nameEl.value = ''; colsEl.value = '';
    await saveGroups();
    renderHead();
    renderCatChips();
    renderBody();
  });

  document.getElementById('reset-btn').addEventListener('click', async () => {
    progress = { period: periodStart(), data: {} };
    await saveProgress();
    renderBody();
  });

  function updateClock() {
    const ms = msUntilNextReset();
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const dStr = d > 0 ? `${d}d ` : '';
    document.getElementById('countdown').textContent = `${dStr}${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
    document.getElementById('today-label').textContent = new Date().toLocaleDateString('pt-BR', { timeZone: TZ, weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  async function checkForRollover() {
    if (progress.period !== periodStart()) {
      progress = { period: periodStart(), data: {} };
      await saveProgress();
      renderBody();
    }
  }

  async function init() {
    await loadGroups();
    await loadMembers();
    await loadProgress();
    renderHead();
    renderCatChips();
    renderBody();
    updateClock();
    setInterval(updateClock, 1000);
    setInterval(checkForRollover, 15000);
  }

  init();
})();
</script>
</body>
</html>
